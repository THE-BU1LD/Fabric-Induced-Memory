name: QFIM code health gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qfim-code-health.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SCIENTIFIC_SHA: 0d4d34b0dacbc13fbf10c3e4316ea44fc4f40d6b
  EVALUATION_FIX_SHA: c08058f923ae59d64aa1f5ef10b24d5cee370aba
  TARGET_SHA: 6c81f902fe771001edf9a7d0cb7c31e6fb2ae783
  PYTHONUNBUFFERED: '1'

jobs:
  code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Provenance
        run: |
          mkdir -p artifacts/code_health/logs
          {
            echo "scientific_freeze=$SCIENTIFIC_SHA"
            echo "evaluation_fix=$EVALUATION_FIX_SHA"
            echo "test_harness_fix=$TARGET_SHA"
            echo "head=$(git rev-parse HEAD)"
            echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python --version
            uname -a
          } > artifacts/code_health/PROVENANCE.txt
      - name: Compile
        run: |
          set -o pipefail
          python -m compileall -q fim fim_experiments results scripts tests 2>&1 | tee artifacts/code_health/logs/compile.log
      - name: Imports
        run: |
          set -o pipefail
          python -c "import fim; import fim_experiments; import fim_experiments.main; import results.run_results; import results.evaluate" 2>&1 | tee artifacts/code_health/logs/import.log
      - name: Tests
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee artifacts/code_health/logs/pytest.log
      - name: Entrypoints
        if: always()
        run: |
          {
            echo '# Entrypoint audit'
            for f in scripts/run_train.sh scripts/run_eval.sh scripts/run_ablation.sh scripts/run_paper_lorenz.sh scripts/run_full_suite.py; do
              if [ -e "$f" ]; then echo "PRESENT $f"; else echo "MISSING $f"; fi
            done
            if [ -e run_train.py ]; then echo 'PRESENT run_train.py'; else echo 'MISSING run_train.py; scripts/run_ablation.sh is stale'; fi
          } > artifacts/code_health/ENTRYPOINT_AUDIT.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qfim-code-health-final
          path: artifacts/code_health
          if-no-files-found: error
