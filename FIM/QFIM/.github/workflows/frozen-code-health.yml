name: QFIM frozen code health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frozen-code-health.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: 0d4d34b0dacbc13fbf10c3e4316ea44fc4f40d6b
  PYTHONUNBUFFERED: '1'

jobs:
  frozen-code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Freeze provenance
        run: |
          mkdir -p artifacts/submission_freeze/logs
          {
            echo '# QFIM Frozen Scientific Provenance'
            echo
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Scientific target SHA: $TARGET_SHA"
            echo "Checked-out HEAD: $(git rev-parse HEAD)"
            echo "Workflow infrastructure SHA: $GITHUB_SHA"
            echo
            echo '## Git status'
            git status --short
            echo
            echo '## Runtime'
            python --version
            uname -a
          } > artifacts/submission_freeze/PROVENANCE.md
          python - <<'PY' >> artifacts/submission_freeze/PROVENANCE.md
          import platform, sys, torch
          print(f'Python full: {sys.version}')
          print(f'Platform: {platform.platform()}')
          print(f'Torch: {torch.__version__}')
          print(f'CUDA available: {torch.cuda.is_available()}')
          mps = getattr(torch.backends, 'mps', None)
          print(f'MPS available: {bool(mps and mps.is_available())}')
          PY
          python - <<'PY'
          import hashlib, json, platform, sys, torch
          from pathlib import Path
          files = ['requirements.txt','pyproject.toml','pytest.ini','fim_experiments/main.py','fim_experiments/train.py','fim_experiments/benchmark.py','fim_experiments/systems.py','results/run_results.py','results/evaluate.py','scripts/run_full_suite.py','scripts/run_paper_lorenz.sh','scripts/run_ablation.sh']
          hashes = {}
          for f in files:
              p=Path(f)
              if p.exists(): hashes[f]=hashlib.sha256(p.read_bytes()).hexdigest()
          payload={
            'repository':'THE-BU1LD/QFIM',
            'scientific_target_sha':'0d4d34b0dacbc13fbf10c3e4316ea44fc4f40d6b',
            'python':sys.version,
            'platform':platform.platform(),
            'torch':torch.__version__,
            'cuda_available':torch.cuda.is_available(),
            'file_sha256':hashes,
          }
          Path('artifacts/submission_freeze/provenance.json').write_text(json.dumps(payload,indent=2))
          PY
      - name: Compile all scientific Python
        run: |
          set -o pipefail
          python -m compileall -q fim fim_experiments results scripts tests 2>&1 | tee artifacts/submission_freeze/logs/compile.log
      - name: Import scientific packages
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee artifacts/submission_freeze/logs/import.log
          import fim
          import fim_experiments
          from fim_experiments.main import default_config, select_benchmark, build_system
          print('IMPORT_PASS')
          PY
      - name: Main test suite
        run: |
          set -o pipefail
          pytest -q tests 2>&1 | tee artifacts/submission_freeze/logs/pytest_main.log
      - name: Epistemic/extended test suite
        run: |
          set -o pipefail
          pytest -q fim/epistemic_tests_full/tests 2>&1 | tee artifacts/submission_freeze/logs/pytest_extended.log
      - name: Entrypoint audit
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          checks=['main.py','scripts/run_full_suite.py','scripts/run_paper_lorenz.sh','scripts/run_ablation.sh','run_train.py']
          out=['# Entrypoint audit','']
          for x in checks: out.append(('PRESENT ' if Path(x).exists() else 'MISSING ') + x)
          out += ['', 'Known static issue:', '- scripts/run_ablation.sh invokes root run_train.py, which is absent at the frozen commit.']
          Path('artifacts/submission_freeze/ENTRYPOINT_AUDIT.md').write_text('\n'.join(out)+'\n')
          PY
      - name: Evaluation semantics audit
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('results/run_results.py').read_text()
          text2 = Path('results/evaluate.py').read_text()
          disabled = 'store_traces=False, retrieve=False' in text
          disabled2 = 'store_traces=False, retrieve=False' in text2
          Path('artifacts/submission_freeze/EVALUATION_SEMANTICS.md').write_text(
              '# Evaluation semantics audit\n\n'
              f'- results/run_results.py disables trace storage and retrieval: {disabled}\n'
              f'- results/evaluate.py disables trace storage and retrieval: {disabled2}\n\n'
              'Consequence: legacy persisted rollout metrics from these evaluators cannot by themselves establish causal benefit of the explicit memory/retrieval mechanism.\n'
          )
          assert disabled and disabled2
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qfim-frozen-code-health
          path: artifacts/submission_freeze
          if-no-files-found: error
