[project]
name = "fim"
version = "0.1.0"
description = "Fabric Induced Memory"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]