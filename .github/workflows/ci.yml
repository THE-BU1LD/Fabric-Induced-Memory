name: CI

on:
  push:
    branches: [main, "2424/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile maintained root sources
        run: |
          python -m compileall -q fim fim_experiments scripts tests
      - name: Collect both maintained root suites
        run: pytest --collect-only -q
      - name: Run both maintained root suites
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: ITFM v3 standard-library contract tests (no scientific campaign)
        working-directory: successor/itfm_v3
        run: python -m unittest -v test_standard
