name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . pytest

      - name: Compile Python sources
        run: python -m compileall -q fim fim_experiments

      - name: Check experiment CLI
        run: python main.py --help

      - name: Check ablation CLI
        run: python -m fim_experiments.ablation --help

      - name: Check ablation report CLI
        run: python -m fim_experiments.ablation_report --help

      - name: Test ablation control semantics
        run: pytest -q tests/test_ablation_controls.py

      - name: End-to-end mechanism ablation smoke
        run: |
          rm -rf /tmp/fim-ablation-smoke
          python -m fim_experiments.ablation \
            --variants full no_memory no_retrieval \
            --seeds 7 \
            --benchmark lorenz96 \
            --device cpu \
            --epochs 1 \
            --batch-size 4 \
            --dataset-size 16 \
            --rollout-steps 2 \
            --results-root /tmp/fim-ablation-smoke
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/fim-ablation-smoke')
          manifest = json.loads((root / 'ablation_manifest.json').read_text())
          assert manifest['variants'] == ['full', 'no_memory', 'no_retrieval']
          assert manifest['seeds'] == [7]
          assert len(manifest['runs']) == 3

          expected = {
              'full': {'store_traces': True, 'retrieve': True},
              'no_memory': {'store_traces': False, 'retrieve': False},
              'no_retrieval': {'store_traces': True, 'retrieve': False},
          }
          seen = set()
          for run in manifest['runs']:
              summary = Path(run['summary'])
              provenance = Path(run['provenance'])
              assert summary.is_file() and summary.stat().st_size > 0
              assert provenance.is_file() and provenance.stat().st_size > 0
              prov = json.loads(provenance.read_text())
              variant = prov['variant']
              assert prov['controls'] == expected[variant]
              assert prov['seed'] == 7
              seen.add(variant)
          assert seen == set(expected)
          print('FIM_ABLATION_SMOKE_PASS')
          PY
