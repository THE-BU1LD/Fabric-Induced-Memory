name: Current FIM component ablations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fim_experiments/ablation_systems.py'
      - 'scripts/run_component_ablations.py'
      - 'scripts/run_ablation.sh'
      - 'scripts/run_paired_fresh_multiseed_v2.py'
      - 'research/CURRENT_COMPONENT_ABLATION_PROTOCOL_20260829.md'
      - 'research/FRESH_MULTI_SEED_REPLICATION_PROTOCOL_V2_20260908.md'
      - '.github/workflows/current-component-ablations.yml'

permissions:
  contents: read

jobs:
  paired-fresh-multiseed-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      DEVICE: cpu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Preflight implementation and ablation semantics
        run: |
          python -m compileall -q fim fim_experiments scripts tests
          pytest -q

      - name: Execute frozen paired v2 matrix
        run: python scripts/run_paired_fresh_multiseed_v2.py

      - name: Require complete generated evidence
        run: |
          test -s results/fresh_paired_multiseed_v2_20260908/manifest.json
          test -s results/fresh_paired_multiseed_v2_20260908/summary.json
          test -s results/fresh_paired_multiseed_v2_20260908/paper_evidence.md
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/fresh_paired_multiseed_v2_20260908/manifest.json')
          data=json.loads(p.read_text())
          assert data['expected_cells'] == {'mechanism': 40, 'baseline': 50}
          assert len(data['runs']) == 90, len(data['runs'])
          assert data['complete'] is True
          assert not data['failures']
          assert all(data['self_check'][k] for k in [
              'data_tensor_identity','split_identity','shuffle_identity','evaluation_identity'
          ])
          print('validated paired FIM v2: 90/90 cells, finite complete matrix, RNG pairing self-check passed')
          PY

      - name: Retain paired v2 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fim-paired-v2-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            results/fresh_paired_multiseed_v2_20260908/**
            research/FRESH_MULTI_SEED_REPLICATION_PROTOCOL_V2_20260908.md
