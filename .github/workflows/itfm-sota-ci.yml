name: ITFM-R source checks

on:
  pull_request:
    paths:
      - "successor/itfm_v2/**"
      - ".github/workflows/itfm-sota-ci.yml"
  push:
    paths:
      - "successor/itfm_v2/**"
      - ".github/workflows/itfm-sota-ci.yml"

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: successor/itfm_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: successor/itfm_v2/locks/cpu.txt
      - name: Install locked CPU environment
        run: |
          python -m pip install --no-cache-dir "torch==2.11.0+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r locks/cpu.txt
          python -m pip install --no-deps -e .
      - name: Format check
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy src/fim_sota
      - name: Unit and miniature smoke tests
        run: pytest -q
      - name: Static frozen-protocol audit
        run: python scripts/audit_sota_protocol.py
      - name: Dependency license scan
        run: python scripts/scan_licenses.py --output results/license-scan.json
      - name: Upload bounded receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itfm-sota-ci-receipts
          path: |
            successor/itfm_v2/results/license-scan.json
          if-no-files-found: ignore
