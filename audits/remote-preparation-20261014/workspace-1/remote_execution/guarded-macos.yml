# Prepared template only. Copy to .github/workflows/itfm-frozen-remote.yml
# in a reviewed deployment checkout AFTER publication/storage approval.
name: ITFM frozen remote campaign
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed deployment commit SHA
        required: true
        type: string
      manifest_sha256:
        description: Reviewed REMOTE_MANIFEST.json SHA-256
        required: true
        type: string
      storage_approved:
        description: Artifact storage cost/quota reviewed and authorized
        required: true
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: itfm-frozen-development-single-campaign
  cancel-in-progress: false
jobs:
  frozen:
    if: ${{ inputs.storage_approved && !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind exact deployment and forbid repeat attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 remote_execution/once.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.15'
          architecture: arm64
      - name: Verify source and unchanged admission guard
        run: python -B remote_execution/run_remote.py preflight --manifest-sha256 "$MANIFEST_SHA"
      - name: Create isolated environment
        run: python -m venv .remote-venv
      - name: Install exact direct requirements after admission
        run: .remote-venv/bin/python -B remote_execution/run_remote.py install --manifest-sha256 "$MANIFEST_SHA"
      - name: V2 raw replay, then V3 tests, campaign and raw verification
        run: .remote-venv/bin/python -B remote_execution/run_remote.py run --manifest-sha256 "$MANIFEST_SHA"
      - name: Retain failures and hash all collected outputs
        if: ${{ always() }}
        run: python3 -B remote_execution/collect.py collect --output remote-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: itfm-${{ github.sha }}-${{ github.run_id }}
          path: remote-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
