[project]
name = "fim-sota"
version = "0.1.0"
description = "Evidence-bound public benchmark stack for ITFM-R"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "torch==2.11.0",
]

[project.scripts]
fim-sota = "fim_sota.cli:main"

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pip-licenses==5.5.5",
  "pytest==9.1.1",
  "ruff==0.17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true


